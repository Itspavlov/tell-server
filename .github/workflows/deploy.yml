name: Выкладка сервера
on:
  push:
    branches: [main]
concurrency: deploy-server
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ключ и сервер
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Выкладка (с автооткатом на сервере)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@"$HOST" server
