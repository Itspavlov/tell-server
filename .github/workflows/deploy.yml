name: Выкладка сервера
on:
  push:
    branches: [main]
concurrency: deploy-server
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ключ и сервер
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "129.101.98.108 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKNEZZ3YeuQmSPwa6XcnM3YJL5sSGenYarykW7024xQq" > ~/.ssh/known_hosts
      - name: Выкладка (с автооткатом на сервере)
        run: ssh -i ~/.ssh/id -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@129.101.98.108 server
